# Only the modules listed in `format` are shown. No Nerd Font required.
add_newline = false
command_timeout = 500
format = "$directory$git_branch$git_status$python$rust$cmd_duration$character"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ""
format = "[$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'

[python]
symbol = "py "
format = '[${symbol}${version}( \($virtualenv\))]($style) '

[rust]
symbol = "rs "
format = '[${symbol}${version}]($style) '

[cmd_duration]
min_time = 3000
format = "[$duration]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
