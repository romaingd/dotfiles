# ── yours (unchanged) ────────────────────────────────────────────────────
set -g mouse on
bind-key C-S set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "wl-copy"

# ── terminal capabilities ────────────────────────────────────────────────
set -g  default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB:clipboard:extkeys,xterm*:extkeys"
set -s  extended-keys on
set -sg escape-time 10
set -g  focus-events on
set -g  set-clipboard on
set -g  allow-passthrough on

# ── comfort ──────────────────────────────────────────────────────────────
set -g  history-limit 50000
set -g  renumber-windows on
bind-key -T copy-mode-vi v send-keys -X begin-selection

# ── agents: flag windows that rang the bell (an agent waiting for you) ───
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# ── popups ───────────────────────────────────────────────────────────────
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind f display-popup -E -w 60% -h 50% tmux-sessionizer
